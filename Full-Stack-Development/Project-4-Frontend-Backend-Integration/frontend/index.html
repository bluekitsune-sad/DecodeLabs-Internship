<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DecodeLabs User Manager</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>DecodeLabs User Manager</h1>
      <p>Project 4 — Responsive frontend wired to a REST API and a SQLite database.</p>
    </header>

    <main class="container">
      <section id="status" class="status" hidden></section>

      <section class="panel">
        <h2>Add a user</h2>
        <form id="create-form" class="user-form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Ava Martinez" autocomplete="off" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. ava@example.com" autocomplete="off" />
          </div>
          <button type="submit" class="button button--primary">Create user</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel__heading">
          <h2>Users</h2>
          <button id="refresh" type="button" class="button button--secondary">Refresh</button>
        </div>
        <p id="loading" class="hint">Loading users…</p>
        <p id="empty" class="hint" hidden>No users yet — add the first one above.</p>
        <p id="list-error" class="error" hidden></p>
        <ul id="user-list" class="user-list"></ul>
      </section>
    </main>

    <div id="edit-dialog" class="dialog" hidden>
      <form id="edit-form" class="panel">
        <h2>Edit user</h2>
        <div class="field">
          <label for="edit-name">Name</label>
          <input type="text" id="edit-name" name="name" />
        </div>
        <div class="field">
          <label for="edit-email">Email</label>
          <input type="email" id="edit-email" name="email" />
        </div>
        <div class="dialog__actions">
          <button type="submit" class="button button--primary">Save changes</button>
          <button type="button" id="edit-cancel" class="button button--secondary">Cancel</button>
        </div>
      </form>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
